name: thumbhq
description: "ThumbHQ - Design Agency Project Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3

  # Auth
  # State Management
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.3.0

  # UI
  google_fonts: ^8.1.0
  intl: ^0.20.3

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  google_sign_in_all_platforms: ^2.0.3
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
